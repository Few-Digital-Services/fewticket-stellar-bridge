version: '3.9'

services:
  stellar-bridge-live:
    build:
      context: .
    container_name: stellar-bridge-live
    restart: always
    env_file:
      - .env.live
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      # Only docker-specific overrides here — do NOT repeat DB_* / secrets from env_file
      # (empty ${VAR} substitutions would wipe values loaded from .env.live).
      - APP_ENV=live
      - BRIDGE_ENVIRONMENT=production
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - app-network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - uploads_data:/app/uploads

  stellar-bridge-sandbox:
    build:
      context: .
    container_name: stellar-bridge-sandbox
    restart: always
    env_file:
      - .env.sandbox
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - APP_ENV=sandbox
      - BRIDGE_ENVIRONMENT=production
      - PORT=5001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - app-network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - uploads_data:/app/uploads

  redis:
    image: redislabs/redismod:latest
    container_name: redis
    restart: always
    ports:
      - "127.0.0.1:6378:6379"
    networks:
      - app-network
    volumes:
      - redis-data:/data

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  redis-data:
    driver: local
  uploads_data: