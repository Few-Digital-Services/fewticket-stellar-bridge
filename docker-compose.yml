version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fewticket-stellar-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: mysql
      DB_PORT: 3306
      APP_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - mysql

  redis:
    image: redis:7-alpine
    container_name: fewticket-stellar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mysql:
    image: mysql:8.4
    container_name: fewticket-stellar-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fewticket_stellar
      MYSQL_USER: fewticket
      MYSQL_PASSWORD: fewticket_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  redis_data:
  mysql_data:
